name: Daily ingestion

on:
  # Nightly 01:00 UTC: reports the completed previous day (the ingestion-day
  # step below sets INGESTION_DAY to yesterday for scheduled runs).
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC, daily
  workflow_dispatch: # manual trigger

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # working-directory is still required: `python ingestion.py` resolves
    # its sibling modules (github/linear/llm/db) via the cwd.
    defaults:
      run:
        working-directory: ingestion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # load_dotenv() finds no .env on a CI runner (gitignored) — it no-ops
      # and these env values satisfy os.getenv() instead. Secrets required:
      #   GITHUB_TOKEN_SECRET   (PAT, "Pull requests: read" is enough)
      #   LINEAR_TOKEN          (lin_api_... personal key)
      #   MONGO_DB_CONNECTION_STRING
      #   LLM_API_KEY           (OpenRouter / provider key)
      #   LLM_BASE_URL, LLM_MODEL  (repo *variables* — not secret, expected
      #                            to change with the provider/model)
      #   SERVICE_TOKEN            (shared with the backend's Render env)
      #   BACKEND_EMBED_URL        (repo *variable* — backend base URL, e.g.
      #                             https://roll-call-api.onrender.com)
      - name: Compute ingestion day
        # scheduled runs report the completed previous day; manual runs keep
        # today (delete this step's `if` to test yesterday's report by hand)
        if: github.event_name == 'schedule'
        run: echo "INGESTION_DAY=$(date -u -d yesterday +%F)" >> "$GITHUB_ENV"

      - name: Run ingestion
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_SECRET }}
          LINEAR_TOKEN: ${{ secrets.LINEAR_TOKEN }}
          MONGO_DB_CONNECTION_STRING: ${{ secrets.MONGO_DB_CONNECTION_STRING }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          BACKEND_EMBED_URL: ${{ vars.BACKEND_EMBED_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
        run: python ingestion.py
