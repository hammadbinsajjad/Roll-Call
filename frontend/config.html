<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Config — Roll-Call</title>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="shell">
  <main class="shell-main">
    <div class="page-header">
      <div>
        <h1>Config</h1>
        <div class="sub">Repositories to watch and team members to summarize.</div>
      </div>
    </div>

    <div class="config-panels">
      <section class="card">
        <h2 style="font-size:16px;margin-bottom:4px">Repositories</h2>
        <p class="sub" style="color:var(--text-dim);font-size:13.5px;margin-bottom:8px">owner/repo — changes save immediately.</p>
        <div class="config-rows" id="repo-rows"></div>
        <form class="config-add" id="repo-add" novalidate>
          <input class="input" id="repo-input" placeholder="owner/repo" aria-label="Repository">
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
        <div class="form-error" id="repo-error"></div>
      </section>

      <section class="card">
        <h2 style="font-size:16px;margin-bottom:4px">Team members</h2>
        <p class="sub" style="color:var(--text-dim);font-size:13.5px;margin-bottom:8px">GitHub username, Linear email, display name.</p>
        <div class="config-rows" id="member-rows"></div>
        <form class="config-add" id="member-add" novalidate>
          <input class="input" id="member-github" placeholder="github_username" aria-label="GitHub username" style="flex:1 1 140px">
          <input class="input" id="member-email" placeholder="linear@company.dev" type="email" aria-label="Linear email" style="flex:1 1 180px">
          <input class="input" id="member-name" placeholder="Full name" aria-label="Member name" style="flex:1 1 140px">
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
        <div class="form-error" id="member-error"></div>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/page-config.js"></script>
</body>
</html>
