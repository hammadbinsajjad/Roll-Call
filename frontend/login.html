<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Roll-Call</title>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-wordmark">Roll<span class="tick">-</span>Call</div>
      <div class="auth-sub">Daily standup summaries, on tap.</div>
      <div class="card">
        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input class="input" id="username" name="username" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div class="form-error" id="error" role="alert"></div>
          <button class="btn btn-primary" id="submit" type="submit" style="width:100%">Log in</button>
        </form>
      </div>
      <p class="auth-alt">No account? <a href="register.html">Register</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/page-login.js"></script>
</body>
</html>
